# Publishes the dashboard (web/) to GitHub Pages on every push to main.
# Off localhost the dashboard reads the live testnet deployment (web/deployment.testnet.json).
name: Pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # Free Pages needs a public repo; until then this job is skipped instead of failing.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Static site, testnet only
        run: |
          mkdir _site
          cp web/index.html web/app.js web/style.css web/abi.json web/deployment.testnet.json _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
