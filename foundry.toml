[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
  "reactive-lib/=lib/reactive-lib-omni/src/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
reactive = "https://mainnet-rpc.rnk.dev/"
base_sepolia = "https://sepolia.base.org"
unichain_sepolia = "https://sepolia.unichain.org"

[invariant]
runs = 256
depth = 60
fail_on_revert = false

[lint]
lint_on_build = false
